[project]
name = "push-xtouch-resolume"
version = "0.0.1"
description = "Passerelle temps réel Resolume Arena <-> Ableton Push 2 / Behringer X-Touch"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
    "numpy>=2",
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pxr = "pxr.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pxr = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
